<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LexOS PRO — Verrouillage</title>
<style>
@font-face{font-family:Orbitron;src:url(polices/orbitron-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:'JetBrains Mono';src:url(polices/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'JetBrains Mono';src:url(polices/jetbrains-mono-latin-700-normal.woff2) format('woff2');font-weight:700}
:root{--orange:#E8590C;--bouton:#C84B0A;--gris:#9A9A9A;--blanc:#EDEDED;--ligne:#2A2A2A;--haut:max(env(safe-area-inset-top),36px);--bas:max(env(safe-area-inset-bottom),18px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--blanc);font-family:'JetBrains Mono',monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}

@keyframes blink{50%{opacity:0}}
@keyframes type{from{max-width:0}to{max-width:100%}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(110vh)}}
@keyframes flicker{0%,91%,100%{opacity:1}92%{opacity:.55}93%{opacity:1}96%{opacity:.8}}
@keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,89,12,.6)}100%{box-shadow:0 0 0 24px rgba(232,89,12,0)}}
@keyframes clockglow{0%,100%{text-shadow:0 0 8px rgba(232,89,12,.35)}50%{text-shadow:0 0 24px rgba(232,89,12,.8)}}
@keyframes hanflick{0%{opacity:.25;transform:scale(1.25) translateY(-6%)}100%{opacity:1;transform:none}}
@keyframes tombe{0%{transform:translateY(-85%) scaleY(1.15);opacity:0;color:#A6FF00;text-shadow:0 0 18px #A6FF00}45%{opacity:1;color:#D8FF9A}100%{transform:none;opacity:1;color:#fff;text-shadow:0 0 8px rgba(232,89,12,.3)}}
@keyframes fleche{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
@keyframes eclair{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}

#scene{position:fixed;inset:0;transition:transform .45s cubic-bezier(.5,0,.75,0),opacity .45s}
#scene.part{transform:translateY(-100%);opacity:0}
#art{position:absolute;left:0;right:0;top:24%;width:100%;animation:flicker 6s infinite,respire 7s ease-in-out infinite}
#lignes{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#balai{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;background:linear-gradient(180deg,rgba(232,89,12,0),rgba(232,89,12,.1),rgba(232,89,12,0));animation:scan 5s linear infinite}

.haut{position:absolute;left:0;right:0;top:0;padding:calc(var(--haut) + 4px) 22px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.invite{align-self:stretch;display:flex;justify-content:space-between;font-size:12px;color:var(--gris)}
.invite b{color:var(--orange);font-weight:700}
#horloge{display:flex;margin-top:14px;font-family:Orbitron;font-weight:700;font-size:86px;line-height:1;color:#fff;animation:clockglow 3.5s ease-in-out infinite}
.chiffre{display:inline-block;width:.66em;text-align:center}
.chiffre.deux{width:.32em}
.chiffre.han{color:#A6FF00;font-family:'Noto Sans CJK SC','Noto Sans SC',sans-serif;font-weight:900;font-size:.72em;line-height:1.38;text-shadow:0 0 10px rgba(166,255,0,.9),0 0 26px rgba(166,255,0,.45);animation:hanflick .16s ease-out}
.chiffre.tombe{animation:tombe .6s cubic-bezier(.3,1.45,.5,1) both}
#date{font-size:14px;color:var(--gris)}
#date span{color:var(--blanc)}
.journal{align-self:stretch;margin-top:14px;display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.5;color:var(--gris)}
.journal div{overflow:hidden;white-space:nowrap;max-width:0;animation:type 1s steps(34,end) forwards}
.journal b{color:var(--orange)}
.cur{display:inline-block;width:.55em;height:1.05em;vertical-align:-.18em;background:var(--orange);animation:blink 1s steps(1) infinite}

.bas{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(var(--bas) + 10px);display:flex;flex-direction:column;gap:16px}
#notif{display:none;padding:12px 14px;border-radius:16px;background:rgba(13,13,13,.94);box-shadow:inset 0 0 0 1px var(--ligne);gap:12px;align-items:center;opacity:0;animation:up .6s ease-out 2.6s forwards}
#notif.on{display:flex}
#notif img{width:40px;height:40px;border-radius:10px}
#notif .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#notif .t div:first-child{display:flex;justify-content:space-between;font-size:11px;color:var(--gris)}
#notif .t div:nth-child(2){font-size:14px;font-weight:700}
.commandes{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.rond{width:56px;height:56px;border-radius:16px;border:1px solid var(--ligne);background:rgba(13,13,13,.94);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .2s,box-shadow .2s}
.rond.on{background:var(--bouton);box-shadow:0 0 18px rgba(232,89,12,.6)}
.centre{display:flex;flex-direction:column;align-items:center;gap:8px}
#empreinte{width:66px;height:66px;border-radius:33px;border:2px solid var(--orange);background:#000;display:flex;align-items:center;justify-content:center;animation:pulse 1.8s ease-out infinite;cursor:pointer}
.centre span{font-size:11px;color:var(--gris)}
.fleches{display:flex;flex-direction:column;align-items:center;margin-bottom:-6px}
.fleches svg{animation:fleche 1.4s ease-in-out infinite}
.fleches svg:nth-child(2){animation-delay:.15s}
#eclair{position:fixed;inset:0;background:var(--orange);opacity:0;pointer-events:none}
#eclair.on{animation:eclair .5s ease-out}
.calme *{animation:none!important}.calme .journal div{max-width:100%}
</style>
</head>
<body>
<div id="scene">
  <img id="art" src="keyart.jpg" alt="">
  <div id="lignes" aria-hidden="true"></div>
  <div id="balai" aria-hidden="true"></div>

  <div class="haut">
    <div class="invite"><span><b>root@lexos-pro</b>:~#</span><span id="batt"></span></div>
    <div id="horloge" aria-live="polite"></div>
    <div id="date"></div>
    <div class="journal">
      <div style="animation-delay:.2s"><b>[ OK ]</b> noyau lexos-pro chargé</div>
      <div style="animation-delay:1.2s"><b>[ OK ]</b> chiffrement de la session actif</div>
      <div style="animation-delay:2.2s"><b>[ OK ]</b> en attente de l'empreinte <span class="cur"></span></div>
    </div>
  </div>

  <div class="bas">
    <div id="notif">
      <img src="icones/lexos-lexos-ia.png" alt="">
      <div class="t"><div><span id="nApp">lexos</span><span id="nQuand"></span></div><div id="nTitre"></div><div id="nTexte" style="font-size:12px;color:#9A9A9A"></div></div>
    </div>
    <div class="fleches" aria-hidden="true">
      <svg width="22" height="10" viewBox="0 0 22 10"><path d="M2 8l9-6 9 6" fill="none" stroke="#E8590C" stroke-width="2" stroke-linecap="round"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10"><path d="M2 8l9-6 9 6" fill="none" stroke="#E8590C" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
    </div>
    <div class="commandes">
      <button class="rond" id="lampe" aria-label="Lampe de poche">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v4l-3 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L7 6z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 13v3" stroke="#E8590C" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="centre">
        <button id="empreinte" aria-label="Déverrouiller">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#E8590C" stroke-width="1.6" stroke-linecap="round"><path d="M5 9a7.5 7.5 0 0 1 14 0"/><path d="M7.5 20c-1-2-1.5-4-1.5-6a6 6 0 0 1 12 0"/><path d="M10.5 21c-.8-2-1.3-4.2-1.3-7a2.8 2.8 0 0 1 5.6 0c0 1.2.2 2.3.5 3.3"/><path d="M12 14c0 2.5.6 4.7 1.7 6.5"/><path d="M17.8 17.5c.1.9.3 1.8.6 2.5"/></g></svg>
        </button>
        <span>$ unlock — glisse vers le haut</span>
      </div>
      <button class="rond" id="camera" aria-label="Appareil photo">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="#E8590C" stroke-width="1.8"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="eclair"></div>

<script>
const V = window.Verrou || { deverrouiller(){ console.log('unlock'); }, lampe(on){ return on; }, camera(){}, battery:()=>78, evenement:()=>'{"type":"sms","nom":"Marie","t":'+(Date.now()-120000)+'}', vibrate(){}, calme:()=>false };
const $ = s => document.querySelector(s);
if (V.calme()) document.body.classList.add('calme');

/* heure : 3 caractères chinois vert lime, puis le chiffre tombe en blanc */
const HAN='龍火雷光電夢力王神風武道心天虎鳳雲星';
function afficherHeure(t, tout){
  const el=$('#horloge');
  if (el.children.length!==t.length){ el.textContent=''; for(const c of t){ const sp=document.createElement('span'); sp.className='chiffre'+(c===':'?' deux':''); el.appendChild(sp); } tout=true; }
  [...t].forEach((c,i)=>{ const sp=el.children[i];
    if (!tout && sp.dataset.v===c) return; sp.dataset.v=c; clearInterval(sp._iv); clearTimeout(sp._to);
    if (c===':' || document.body.classList.contains('calme')){ sp.textContent=c; return; }
    sp._to=setTimeout(()=>{ let k=0; const tour=()=>{ if(k<3){ sp.className='chiffre'; void sp.offsetWidth; sp.className='chiffre han'; sp.textContent=HAN[Math.floor(Math.random()*HAN.length)]; k++; } else { clearInterval(sp._iv); sp.className='chiffre'; void sp.offsetWidth; sp.textContent=c; sp.className='chiffre tombe'; } }; tour(); sp._iv=setInterval(tour,190); }, i*110);
  });
}
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'], MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function tic(tout){
  const d=new Date(); afficherHeure(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), tout===true);
  $('#date').innerHTML='$ date → <span>'+JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+'</span>';
  try { $('#batt').textContent='⚡ '+V.battery()+' %'; } catch(e){}
}
tic(true); setInterval(()=>tic(false), 2000);
window.verrouRetour=()=>{ tic(true); };

/* dernier SMS / appel */
try {
  const e=JSON.parse(V.evenement()||'null');
  if (e && e.nom && Date.now()-e.t < 3600*1000){
    const min=Math.round((Date.now()-e.t)/60000);
    $('#nApp').textContent=e.type==='appel'?'téléphone':'messages';
    $('#nQuand').textContent=min<1?'maintenant':'il y a '+min+' min';
    $('#nTitre').textContent=(e.type==='appel'?'☎ appel manqué — ':'✉ ')+e.nom;
    $('#nTexte').textContent=e.type==='appel'?'touche pour rappeler':'nouveau message';
    $('#notif').classList.add('on');
  }
} catch(err){}

/* déverrouiller : glisser vers le haut (ou toucher l'empreinte) */
let parti=false;
function deverrouiller(){
  if (parti) return; parti=true; V.vibrate();
  const e=$('#eclair'); e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
  $('#scene').classList.add('part');
  setTimeout(()=>V.deverrouiller(), 300);
  setTimeout(()=>{ parti=false; $('#scene').classList.remove('part'); }, 1500);
}
let y0=null;
document.addEventListener('touchstart',e=>{ y0=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchmove',e=>{ if(y0===null) return; const dy=e.touches[0].clientY-y0; if(dy<0) $('#scene').style.transform='translateY('+(dy*0.4)+'px)'; },{passive:true});
document.addEventListener('touchend',e=>{ if(y0===null) return; const dy=e.changedTouches[0].clientY-y0; y0=null; $('#scene').style.transform='';
  if (dy < -110) deverrouiller(); },{passive:true});
$('#empreinte').onclick=deverrouiller;
$('#notif').onclick=deverrouiller;
let lampe=false;
$('#lampe').onclick=()=>{ lampe=!lampe; lampe=!!V.lampe(lampe); $('#lampe').classList.toggle('on',lampe); V.vibrate(); };
$('#camera').onclick=()=>{ V.vibrate(); V.camera(); };
</script>
</body>
</html>
