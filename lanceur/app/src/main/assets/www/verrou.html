<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LexOS PRO — Verrouillage</title>
<style>
@font-face{font-family:Orbitron;src:url(polices/orbitron-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:'JetBrains Mono';src:url(polices/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'JetBrains Mono';src:url(polices/jetbrains-mono-latin-700-normal.woff2) format('woff2');font-weight:700}
:root{--orange:var(--acc);--bouton:var(--btn);--gris:#9A9A9A;--blanc:#EDEDED;--ligne:#2A2A2A;--haut:max(env(safe-area-inset-top),36px);--bas:max(env(safe-area-inset-bottom),18px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--blanc);font-family:'JetBrains Mono',monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}

@keyframes blink{50%{opacity:0}}
@keyframes type{from{max-width:0}to{max-width:100%}}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(110vh)}}
@keyframes flicker{0%,91%,100%{opacity:1}92%{opacity:.6}93%{opacity:1}96%{opacity:.85}}
@keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.6)}100%{box-shadow:0 0 0 24px rgba(var(--acc-rgb),0)}}
@keyframes clockglow{0%,100%{text-shadow:0 0 8px rgba(var(--acc-rgb),.35)}50%{text-shadow:0 0 24px rgba(var(--acc-rgb),.8)}}
@keyframes hanflick{0%{opacity:.25;transform:scale(1.25) translateY(-6%)}100%{opacity:1;transform:none}}
@keyframes tombe{0%{transform:translateY(-85%) scaleY(1.15);opacity:0;color:#A6FF00;text-shadow:0 0 18px #A6FF00}45%{opacity:1;color:#D8FF9A}100%{transform:none;opacity:1;color:#fff;text-shadow:0 0 8px rgba(var(--acc-rgb),.3)}}
@keyframes fleche{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
@keyframes eclair{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
/* cartes en diagonale : elles glissent le long de la diagonale à 45° */
@keyframes diag{from{opacity:0;transform:translate(-40px,-40px)}to{opacity:1;transform:none}}
/* notifications : une par une, en douceur */
@keyframes notif-in{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

#scene{position:fixed;inset:0;transition:transform .45s cubic-bezier(.5,0,.75,0),opacity .45s}
#scene.part{transform:translateY(-100%);opacity:0}
#art{position:absolute;left:0;right:0;top:30%;width:100%;animation:flicker 6s infinite,respire 7s ease-in-out infinite}
#art.perso{top:0;height:100%;object-fit:cover;animation:none}
#ombre{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.15) 42%,rgba(0,0,0,.2) 58%,rgba(0,0,0,.8) 100%)}
#lignes{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#balai{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;background:linear-gradient(180deg,rgba(var(--acc-rgb),0),rgba(var(--acc-rgb),.1),rgba(var(--acc-rgb),0));animation:scan 5s linear infinite}

/* ---------- heure en haut à gauche ---------- */
.haut{position:absolute;left:0;right:0;top:0;padding:calc(var(--haut) + 2px) 18px 0;display:flex;flex-direction:column;align-items:flex-start}
.invite{align-self:stretch;display:flex;justify-content:space-between;font-size:12px;color:var(--gris)}
.invite b{color:var(--orange);font-weight:700}
#horloge{display:flex;margin:10px 0 0 -4px;font-family:Orbitron;font-weight:700;font-size:78px;line-height:1;color:#fff;animation:clockglow 3.5s ease-in-out infinite}
.chiffre{display:inline-block;width:.66em;text-align:center}
.chiffre.deux{width:.32em}
.chiffre.han{color:#A6FF00;font-family:'Noto Sans CJK SC','Noto Sans SC',sans-serif;font-weight:900;font-size:.72em;line-height:1.38;text-shadow:0 0 10px rgba(166,255,0,.9),0 0 26px rgba(166,255,0,.45);animation:hanflick .16s ease-out}
.chiffre.tombe{animation:tombe .6s cubic-bezier(.3,1.45,.5,1) both}
#date{margin-top:4px;font-size:13px;color:var(--gris)}
#date span{color:var(--blanc)}
.etat{margin-top:6px;font-size:11px;color:var(--gris);overflow:hidden;white-space:nowrap;max-width:0;animation:type 1s steps(34,end) .3s forwards}
.etat b{color:var(--orange)}
.cur{display:inline-block;width:.55em;height:1.05em;vertical-align:-.18em;background:var(--orange);animation:blink 1s steps(1) infinite}

/* ---------- cartes météo / agenda : escalier à 45° vers la droite ---------- */
#cartes{position:relative;margin-top:18px;align-self:stretch;height:250px}
.carte{position:absolute;width:58%;min-height:62px;padding:10px 12px;border-radius:16px;background:rgba(10,10,10,.82);box-shadow:inset 0 0 0 1px var(--ligne),0 6px 22px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;opacity:0;animation:diag .6s cubic-bezier(.2,.8,.2,1) forwards}
.carte .ico{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:#000;box-shadow:inset 0 0 0 1px var(--orange);display:flex;align-items:center;justify-content:center}
.carte .txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.carte .l1{font-size:10px;color:var(--gris)}
.carte .l2{font-size:14px;font-weight:700;color:var(--blanc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte .l2 b{font-family:Orbitron;font-size:18px;color:#fff}
.carte .l3{font-size:11px;color:var(--orange);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- bas : notifications une par une + commandes ---------- */
.bas{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(var(--bas) + 10px);display:flex;flex-direction:column;gap:12px}
#notifs{display:flex;flex-direction:column;gap:8px}
.notif{padding:10px 12px;border-radius:16px;background:rgba(13,13,13,.9);box-shadow:inset 0 0 0 1px var(--ligne);display:flex;gap:10px;align-items:center;opacity:0;animation:notif-in .55s cubic-bezier(.2,.8,.2,1) forwards}
.notif .pastille{width:8px;height:8px;border-radius:4px;flex:0 0 8px;background:var(--orange);box-shadow:0 0 8px var(--orange)}
.notif .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.notif .t div:first-child{display:flex;justify-content:space-between;font-size:10px;color:var(--gris)}
.notif .t div:nth-child(2){font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif .t div:nth-child(3){font-size:11px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.commandes{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.rond{width:54px;height:54px;border-radius:16px;border:1px solid var(--ligne);background:rgba(13,13,13,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .2s,box-shadow .2s}
.rond.on{background:var(--bouton);box-shadow:0 0 18px rgba(var(--acc-rgb),.6)}
.centre{display:flex;flex-direction:column;align-items:center;gap:6px}
#empreinte{width:64px;height:64px;border-radius:32px;border:2px solid var(--orange);background:#000;display:flex;align-items:center;justify-content:center;animation:pulse 1.8s ease-out infinite;cursor:pointer}
.centre span{font-size:10.5px;color:var(--gris)}
.fleches{display:flex;flex-direction:column;align-items:center;margin-bottom:-8px}
.fleches svg{animation:fleche 1.4s ease-in-out infinite}
.fleches svg:nth-child(2){animation-delay:.15s}
#eclair{position:fixed;inset:0;background:var(--orange);opacity:0;pointer-events:none}
#eclair.on{animation:eclair .5s ease-out}
/* ===== indicateurs LexOS : batterie + réseau ===== */
@keyframes lx-vague{0%,100%{background:#262626;box-shadow:none}50%{background:#A6FF00;box-shadow:0 0 6px #A6FF00}}
@keyframes lx-eclair{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
@keyframes lx-onde{0%,62%,100%{filter:none}72%{filter:brightness(2.2)}}
@keyframes lx-glitch{0%,100%{transform:none}20%{transform:translateX(-1px)}40%{transform:translateX(1px)}60%{opacity:.6}}
.lxb{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.lxb .lxcorps{position:relative;display:inline-flex;gap:2px;padding:2px;margin-right:4px;border:1.5px solid var(--acc);border-radius:4px;box-shadow:0 0 6px rgba(var(--acc-rgb),.45)}
.lxb .lxcorps::after{content:'';position:absolute;right:-5px;top:3.5px;width:3px;height:6px;border-radius:0 2px 2px 0;background:var(--acc)}
.lxb .seg{width:4px;height:9px;border-radius:1px;background:#262626}
.lxb .seg.on{background:var(--acc);box-shadow:0 0 5px var(--acc)}
.lxb.faible .lxcorps{border-color:#FF3B30;box-shadow:0 0 8px rgba(255,59,48,.6)}
.lxb.faible .seg.on{background:#FF3B30;box-shadow:0 0 6px #FF3B30;animation:blink 1s steps(1) infinite}
.lxb.charge .seg:not(.on){animation:lx-vague 1.6s ease-in-out infinite}
.lxb .pct{font-weight:700;color:#EDEDED}
.lxb .eclair{display:none;color:#A6FF00;animation:lx-eclair 1s ease-in-out infinite}
.lxb.charge .eclair{display:inline}
.lxr{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.lxr .barres{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.lxr .barres i{width:3px;border-radius:1px;background:#2A2A2A}
.lxr .barres i.on{background:var(--acc);box-shadow:0 0 5px var(--acc);animation:lx-onde 2.4s ease-in-out infinite}
.lxr .type{font-weight:700;color:#EDEDED}
.lxr.aucun .barres i{background:#FF3B30;opacity:.35}
.lxr.aucun .type{color:#FF6B6B;animation:lx-glitch .5s steps(2) infinite}

.calme *{animation:none!important}.calme .etat{max-width:100%}.calme .carte,.calme .notif{opacity:1}

/* ===== couleur principale (changeable dans le menu) ===== */
:root{--acc:#E8590C;--acc-rgb:232,89,12;--acc2:#FF8A4C;--btn:#C84B0A;--filtre:none}
[stroke="#FFC53D"]{stroke:var(--acc)}[fill="#FFC53D"]{fill:var(--acc)}
img.lex,#splash .logo img{filter:var(--filtre)}
</style>
<script>
/* couleur principale : appliquée avant tout le reste */
const COULEURS={
  orange:{n:'orange',acc:'#E8590C',rgb:'232,89,12',acc2:'#FF8A4C',btn:'#C84B0A',h:22},
  or:{n:'or',acc:'#FFC53D',rgb:'255,197,61',acc2:'#FFD866',btn:'#8A6A00',h:44},
  lime:{n:'lime',acc:'#A6FF00',rgb:'166,255,0',acc2:'#C9FF66',btn:'#3F6300',h:81},
  rouge:{n:'rouge',acc:'#FF3B30',rgb:'255,59,48',acc2:'#FF7A72',btn:'#B3261E',h:3},
  cyan:{n:'cyan',acc:'#22D3EE',rgb:'34,211,238',acc2:'#7DE8F7',btn:'#0E7490',h:188},
  violet:{n:'violet',acc:'#B46BFF',rgb:'180,107,255',acc2:'#D0A5FF',btn:'#6D28D9',h:270},
  rose:{n:'rose',acc:'#FF2BD6',rgb:'255,43,214',acc2:'#FF7FE6',btn:'#A21CAF',h:312},
  blanc:{n:'blanc',acc:'#EDEDED',rgb:'237,237,237',acc2:'#FFFFFF',btn:'#555555',h:null}
};
function appliquerCouleur(nom){
  const c=COULEURS[nom]||COULEURS.orange, r=document.documentElement.style;
  r.setProperty('--acc',c.acc); r.setProperty('--acc-rgb',c.rgb); r.setProperty('--acc2',c.acc2); r.setProperty('--btn',c.btn);
  // les icônes dorées suivent la couleur choisie
  r.setProperty('--filtre', c.h===null ? 'grayscale(1) brightness(1.15)' : (c.h===22 ? 'none' : 'hue-rotate('+(c.h-22)+'deg)'));
  window.COULEUR=c;
}
try { appliquerCouleur(JSON.parse(localStorage.getItem('lexos.couleur')||'"orange"')); } catch(e){ appliquerCouleur('orange'); }
</script>
</head>
<body>
<div id="scene">
  <img id="art" src="keyart.jpg" alt="">
  <div id="ombre" aria-hidden="true"></div>
  <div id="lignes" aria-hidden="true"></div>
  <div id="balai" aria-hidden="true"></div>

  <div class="haut">
    <div class="invite"><span><b>root@lexos-pro</b>:~#</span><span id="batt"></span></div>
    <div id="horloge" aria-live="polite"></div>
    <div id="date"></div>
    <div class="etat"><b>[ OK ]</b> en attente de l'empreinte <span class="cur"></span></div>
    <div id="cartes"></div>
  </div>

  <div class="bas">
    <div id="notifs" aria-live="polite"></div>
    <div class="fleches" aria-hidden="true">
      <svg width="22" height="10" viewBox="0 0 22 10"><path d="M2 8l9-6 9 6" fill="none" stroke="#FFC53D" stroke-width="2" stroke-linecap="round"/></svg>
      <svg width="22" height="10" viewBox="0 0 22 10"><path d="M2 8l9-6 9 6" fill="none" stroke="#FFC53D" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
    </div>
    <div class="commandes">
      <button class="rond" id="lampe" aria-label="Lampe de poche">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v4l-3 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L7 6z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 13v3" stroke="#FFC53D" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="centre">
        <button id="empreinte" aria-label="Déverrouiller">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#FFC53D" stroke-width="1.6" stroke-linecap="round"><path d="M5 9a7.5 7.5 0 0 1 14 0"/><path d="M7.5 20c-1-2-1.5-4-1.5-6a6 6 0 0 1 12 0"/><path d="M10.5 21c-.8-2-1.3-4.2-1.3-7a2.8 2.8 0 0 1 5.6 0c0 1.2.2 2.3.5 3.3"/><path d="M12 14c0 2.5.6 4.7 1.7 6.5"/><path d="M17.8 17.5c.1.9.3 1.8.6 2.5"/></g></svg>
        </button>
        <span>$ unlock — glisse vers le haut</span>
      </div>
      <button class="rond" id="camera" aria-label="Appareil photo">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="#FFC53D" stroke-width="1.8"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="eclair"></div>

<script>
const V = window.Verrou || {
  deverrouiller(){ console.log('unlock'); }, lampe(on){ return on; }, camera(){}, battery:()=>78, batterieInfo:()=>'{"niveau":15,"charge":false}', reseau:()=>'{"type":"cell","force":2}', vibrate(){}, calme:()=>false,
  evenement:()=>'null',
  agenda:()=>JSON.stringify([{titre:'Souper en famille',debut:Date.now()+3*3600e3,jour:false},{titre:'Réunion ti-lex',debut:Date.now()+26*3600e3,jour:false}]),
  notifications:()=>JSON.stringify([{app:'Messages',titre:'Marie-Ève',texte:'On se voit ce soir?',t:Date.now()-60e3},{app:'GitHub',titre:'APK Lanceur LexOS PRO',texte:'Compilation réussie',t:Date.now()-900e3},{app:'Termux',titre:'lexos-update',texte:'[ OK ] terminé',t:Date.now()-3600e3}])
};
const $ = s => document.querySelector(s);
const lire = (k,d) => { try { const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const ecrire = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const echap = t => String(t||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if (V.calme()) document.body.classList.add('calme');

/* fond : l'image choisie dans le lanceur, sinon le key art LEXOS */
(function(){ const fd=lire('lexos.fond',null); if (fd){ const a=$('#art'); a.src=fd; a.classList.add('perso'); } })();

/* ===== heure : 3 caractères chinois vert lime, puis le chiffre tombe en blanc ===== */
const HAN='龍火雷光電夢力王神風武道心天虎鳳雲星';
function afficherHeure(t, tout){
  const el=$('#horloge');
  if (el.children.length!==t.length){ el.textContent=''; for(const c of t){ const sp=document.createElement('span'); sp.className='chiffre'+(c===':'?' deux':''); el.appendChild(sp); } tout=true; }
  [...t].forEach((c,i)=>{ const sp=el.children[i];
    if (!tout && sp.dataset.v===c) return; sp.dataset.v=c; clearInterval(sp._iv); clearTimeout(sp._to);
    if (c===':' || document.body.classList.contains('calme')){ sp.textContent=c; return; }
    sp._to=setTimeout(()=>{ let k=0; const tour=()=>{ if(k<3){ sp.className='chiffre'; void sp.offsetWidth; sp.className='chiffre han'; sp.textContent=HAN[Math.floor(Math.random()*HAN.length)]; k++; } else { clearInterval(sp._iv); sp.className='chiffre'; void sp.offsetWidth; sp.textContent=c; sp.className='chiffre tombe'; } }; tour(); sp._iv=setInterval(tour,190); }, i*110);
  });
}
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'], MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function tic(tout){
  const d=new Date(); afficherHeure(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), tout===true);
  $('#date').innerHTML='$ date → <span>'+JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+'</span>';
  try { const x=lxIndicateurs(V), h=x.res+'&nbsp;&nbsp;'+x.bat; if($('#batt').dataset.h!==h){ $('#batt').innerHTML=h; $('#batt').dataset.h=h; } } catch(e){}
}

/* ===== indicateurs LexOS : batterie + réseau ===== */
function lxIndicateurs(P){
  let b={niveau:0,charge:false}, r={type:'aucun',force:0};
  try { b=JSON.parse(P.batterieInfo()); } catch(e){ try { b.niveau=P.battery(); } catch(_){} }
  try { r=JSON.parse(P.reseau()); } catch(e){}
  const n=Math.round(b.niveau/10), cl='lxb'+(b.charge?' charge':'')+(b.niveau<=20&&!b.charge?' faible':'');
  let segs=''; for(let i=0;i<10;i++) segs+='<i class="seg'+(i<n?' on':'')+'" style="animation-delay:'+(i*0.12).toFixed(2)+'s"></i>';
  const bat='<span class="'+cl+'"><span class="lxcorps">'+segs+'</span><span class="pct">'+b.niveau+'%</span><span class="eclair">⚡</span></span>';
  let bar=''; for(let i=0;i<4;i++) bar+='<i class="'+(i<r.force?'on':'')+'" style="height:'+(4+i*3)+'px;animation-delay:'+(i*0.15).toFixed(2)+'s"></i>';
  const nom={wifi:'wifi',cell:'mobile',autre:'réseau',aucun:'hors ligne'}[r.type]||r.type;
  const res='<span class="lxr'+(r.type==='aucun'?' aucun':'')+'"><span class="barres">'+bar+'</span><span class="type">'+nom+'</span></span>';
  return {bat, res};
}

/* ===== cartes : météo + agenda, en escalier à 45° ===== */
const ICO={
  soleil:'<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="#FFC53D"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="#EDEDED" stroke-width="1.6" stroke-linecap="round"/></svg>',
  nuage:'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  pluie:'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 14z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3" stroke="#FFC53D" stroke-width="1.8" stroke-linecap="round"/></svg>',
  neige:'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 13h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 13z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><g fill="#FFC53D"><circle cx="8" cy="17.5" r="1.2"/><circle cx="12" cy="19.5" r="1.2"/><circle cx="16" cy="17.5" r="1.2"/></g></svg>',
  orage:'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 13h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 13z" fill="none" stroke="#EDEDED" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 14l-2 4h3l-2 4" fill="none" stroke="#FFC53D" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  agenda:'<svg width="20" height="20" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="#EDEDED" stroke-width="1.7"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="#FFC53D" stroke-width="1.8" stroke-linecap="round"/></svg>'
};
function meteoTexte(code){
  if (code===0) return ['soleil','dégagé']; if (code<=3) return ['nuage','nuageux']; if (code<=48) return ['nuage','brouillard'];
  if (code<=67 || (code>=80 && code<=82)) return ['pluie','pluie']; if (code<=77 || code===85 || code===86) return ['neige','neige']; return ['orage','orage'];
}
const cartes=[];
function ajouterCarte(ico,l1,l2,l3){ cartes.push({ico,l1,l2,l3}); }
function rendreCartes(){
  const box=$('#cartes'); box.innerHTML='';
  const pas = 74;                       // même décalage en x et en y → diagonale à 45°
  cartes.slice(0,3).forEach((c,i)=>{
    const d=document.createElement('div'); d.className='carte';
    d.style.left=(i*pas*0.9)+'px'; d.style.top=(i*pas)+'px';
    d.style.animationDelay=(0.5+i*0.22)+'s';
    d.innerHTML='<div class="ico">'+ICO[c.ico]+'</div><div class="txt"><div class="l1">'+c.l1+'</div><div class="l2">'+c.l2+'</div>'+(c.l3?'<div class="l3">'+c.l3+'</div>':'')+'</div>';
    box.appendChild(d);
  });
}
function heureCourte(t){ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function quandAgenda(e){
  const d=new Date(e.debut), auj=new Date(); const dem=new Date(); dem.setDate(auj.getDate()+1);
  const jour = d.toDateString()===auj.toDateString() ? "aujourd'hui" : d.toDateString()===dem.toDateString() ? 'demain' : JOURS[d.getDay()];
  return jour + (e.jour ? ' · toute la journée' : ' · '+heureCourte(e.debut));
}
async function chargerMeteo(){
  const ville=lire('lexos.ville',null);
  if (!ville){ ajouterCarte('nuage','$ meteo','choisis ta ville','lanceur → menu → météo'); return; }
  let m=lire('lexos.meteo',null);
  if (!m || m.ville!==ville.nom || Date.now()-m.t > 30*60*1000){
    try {
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+ville.lat+'&longitude='+ville.lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto');
      const j=await r.json();
      m={ville:ville.nom,t:Date.now(),temp:Math.round(j.current.temperature_2m),code:j.current.weather_code,max:Math.round(j.daily.temperature_2m_max[0]),min:Math.round(j.daily.temperature_2m_min[0])};
      ecrire('lexos.meteo',m);
    } catch(e){ if(!m){ ajouterCarte('nuage','$ meteo — '+echap(ville.nom),'hors ligne',''); return; } }
  }
  const [ico,txt]=meteoTexte(m.code);
  ajouterCarte(ico,'$ meteo — '+echap(m.ville).toLowerCase(),'<b>'+m.temp+'°</b> '+txt,'max '+m.max+'° · min '+m.min+'°');
}
function chargerAgenda(){
  let a=null; try { a=JSON.parse(V.agenda()); } catch(e){}
  if (a===null){ ajouterCarte('agenda','$ agenda','accès non permis','lanceur → menu → agenda'); return; }
  if (!a.length){ ajouterCarte('agenda','$ agenda','rien de prévu','48 prochaines heures'); return; }
  a.slice(0,2).forEach(e=>ajouterCarte('agenda','$ agenda',echap(e.titre),quandAgenda(e)));
}

/* ===== notifications : apparaissent une par une, en douceur ===== */
function depuis(t){ const m=Math.round((Date.now()-t)/60000); return m<1?'maintenant':m<60?m+' min':Math.round(m/60)+' h'; }
function rendreNotifs(){
  let l=[]; try { l=JSON.parse(V.notifications())||[]; } catch(e){}
  if (!l.length){ try { const e=JSON.parse(V.evenement()); if(e&&e.nom&&Date.now()-e.t<3600e3) l=[{app:e.type==='appel'?'Téléphone':'Messages',titre:(e.type==='appel'?'☎ appel manqué — ':'✉ ')+e.nom,texte:'',t:e.t}]; } catch(err){} }
  const box=$('#notifs'); box.innerHTML='';
  l.slice(0,3).forEach((n,i)=>{
    const d=document.createElement('div'); d.className='notif'; d.style.animationDelay=(1.2+i*0.45)+'s';
    d.innerHTML='<i class="pastille"></i><div class="t"><div><span>'+echap(n.app).toLowerCase()+'</span><span>'+depuis(n.t)+'</span></div><div>'+echap(n.titre)+'</div>'+(n.texte?'<div>'+echap(n.texte)+'</div>':'')+'</div>';
    d.onclick=deverrouiller; box.appendChild(d);
  });
}

async function tout(){
  cartes.length=0; tic(true);
  await chargerMeteo(); chargerAgenda(); rendreCartes(); rendreNotifs();
}
tout(); setInterval(()=>tic(false), 2000);
window.verrouRetour=()=>{ tout(); };

/* ===== déverrouiller : glisser vers le haut (ou toucher l'empreinte) ===== */
let parti=false;
function deverrouiller(){
  if (parti) return; parti=true; V.vibrate();
  const e=$('#eclair'); e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
  $('#scene').classList.add('part');
  setTimeout(()=>V.deverrouiller(), 300);
  setTimeout(()=>{ parti=false; $('#scene').classList.remove('part'); }, 1500);
}
let y0=null;
document.addEventListener('touchstart',e=>{ y0=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchmove',e=>{ if(y0===null) return; const dy=e.touches[0].clientY-y0; if(dy<0) $('#scene').style.transform='translateY('+(dy*0.4)+'px)'; },{passive:true});
document.addEventListener('touchend',e=>{ if(y0===null) return; const dy=e.changedTouches[0].clientY-y0; y0=null; $('#scene').style.transform=''; if (dy < -110) deverrouiller(); },{passive:true});
$('#empreinte').onclick=deverrouiller;
let lampe=false;
$('#lampe').onclick=()=>{ lampe=!lampe; lampe=!!V.lampe(lampe); $('#lampe').classList.toggle('on',lampe); V.vibrate(); };
$('#camera').onclick=()=>{ V.vibrate(); V.camera(); };
</script>
