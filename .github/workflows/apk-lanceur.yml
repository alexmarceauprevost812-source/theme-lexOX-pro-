# Construit l'APK du lanceur LexOS PRO (dossier lanceur/) sur GitHub, gratuitement.
# Se lance tout seul quand lanceur/ change, ou à la main :
#   onglet « Actions » → « APK Lanceur LexOS PRO » → « Run workflow ».
# ~5-8 min plus tard : lien direct dans « Releases » → lanceur-lexos-pro.
name: APK Lanceur LexOS PRO

on:
  push:
    paths:
      - 'lanceur/**'
      - '.github/workflows/apk-lanceur.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lanceur
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Clé de signature d'Alex Marceau Prevost (Settings → Secrets → Actions).
      - name: Clé de signature
        env:
          B64: ${{ secrets.LEXOS_KEYSTORE_B64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/lexos.jks"
            echo "LEXOS_KEYSTORE_PATH=$RUNNER_TEMP/lexos.jks" >> "$GITHUB_ENV"
            echo "Signature : clé d'Alex Marceau Prevost"
          else
            echo "Signature : ancienne clé (ajoute les secrets LEXOS_KEYSTORE_B64 et LEXOS_KEYSTORE_PASS)"
          fi

      - name: Compiler l'APK
        env:
          LEXOS_KEYSTORE_PASS: ${{ secrets.LEXOS_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "certificate DN" || true

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk LexOS-PRO-Lanceur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LexOS-PRO-Lanceur-apk
          path: lanceur/LexOS-PRO-Lanceur.apk

      - name: Publier un lien direct (Release publique)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lanceur-lexos-pro LexOS-PRO-Lanceur.apk \
            --title "Lanceur LexOS PRO — APK (dernière version)" \
            --notes "Lanceur Android LexOS PRO (thème terminal noir/orange). Télécharge LexOS-PRO-Lanceur.apk, installe-le (autorise les sources inconnues), puis appuie sur le bouton Accueil et choisis LexOS PRO → Toujours." \
            --latest=false 2>/dev/null \
          || gh release upload lanceur-lexos-pro LexOS-PRO-Lanceur.apk --clobber
